<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leads orgânicos WFIA</title>
<style>
:root{--bg:#EEF5FC;--card:#fff;--ink:#0A1324;--muted:#4B5A70;--line:#DCE7F3;--blue:#0A9BFF;--bad:#E03131}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#08111F;--card:#0F1B2E;--ink:#EEF4FB;--muted:#9DB0C7;--line:#1E2E46;--blue:#2FAEFF;--bad:#FF6B6B}}
:root[data-theme="dark"]{--bg:#08111F;--card:#0F1B2E;--ink:#EEF4FB;--muted:#9DB0C7;--line:#1E2E46;--blue:#2FAEFF;--bad:#FF6B6B}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,'Helvetica Neue',Arial,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:100%;max-width:360px;box-shadow:0 6px 20px rgba(10,40,80,.08);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.5rem;letter-spacing:-.03em}p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer}
.e{color:var(--bad);font-size:13px;min-height:1em}
</style></head><body><div class="w"><form id="f"><h1>Leads orgânicos WFIA</h1><p>Digite a senha para abrir o dashboard.</p>
